<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Math Hacker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#334155" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- 흩어진 수식 -->
  <g font-family="'Latin Modern Math','STIX Two Math','Cambria Math',Georgia,serif" fill="#94a3b8" opacity="0.35">
    <text x="760" y="70" font-size="30">log₂ 8 = 3</text>
    <text x="1010" y="130" font-size="26">∫₀¹ f(x) dx</text>
    <text x="870" y="205" font-size="28">a<tspan dy="-12" font-size="18">|x|</tspan></text>
    <text x="960" y="265" font-size="26">lim<tspan dy="8" font-size="16">n→∞</tspan></text>
    <text x="1120" y="215" font-size="30">Σ</text>
    <text x="1150" y="80" font-size="24">√2</text>
  </g>

  <!-- 잘린 문제 카드 (문제 단위로 쪼갠다는 느낌) -->
  <g transform="translate(700 92)" opacity="0.9">
    <rect x="0" y="0" width="120" height="150" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="16" y="20" width="44" height="8" rx="4" fill="#38bdf8"/>
    <rect x="16" y="40" width="88" height="6" rx="3" fill="#475569"/>
    <rect x="16" y="54" width="72" height="6" rx="3" fill="#475569"/>
    <rect x="16" y="68" width="80" height="6" rx="3" fill="#475569"/>
    <circle cx="96" cy="124" r="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <path d="M90 124l4 4 8-9" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 타이틀 -->
  <g font-family="-apple-system,'Segoe UI','Pretendard','Apple SD Gothic Neo',Helvetica,Arial,sans-serif">
    <text x="80" y="150" font-size="72" font-weight="800" fill="#f8fafc" letter-spacing="-1">Math Hacker</text>
    <rect x="82" y="172" width="220" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="80" y="222" font-size="26" fill="#cbd5e1">문제지 PDF를 문제 단위로 쪼개서, 매일 풀고 기록하는 수학 연습 앱</text>
  </g>
</svg>
